[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "games-corpus"
version = "0.2.2"
description = "A Python library for working with collaborative dialogue game corpora (Spanish, English, Slovak)"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Agustín Gravano" },
    { name = "Juan E. Kamienkowski" },
    { name = "Pablo Brusco" },
]
readme = "README.md"
keywords = ["corpus", "dialogue", "turn-taking", "prosody", "speech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pandas>=1.5.0",
    "requests>=2.28.0",
]

[tool.hatch.build.targets.sdist]
exclude = ["features/", "corpus/", "examples/", "tests/", "scripts/", "dist/"]

[project.urls]
Homepage = "https://github.com/pbrusco/games-corpus"
Repository = "https://github.com/pbrusco/games-corpus"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.15.0",
    "mypy>=1.19.0",
    "pandas-stubs",
    "types-requests",
    "pre-commit>=4.0.0",
    "librosa",
    "soundfile",
    "matplotlib",
    "seaborn",
    "numpy",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # line length handled by ruff-format

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "games_corpus.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "to_be_reviewed_by_human: tests that need human verification of expected values",
]
